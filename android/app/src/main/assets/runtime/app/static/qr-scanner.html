<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155c3b">
<title>EthioFerti AI — QR Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f1;color:#20352a;font-family:Arial,sans-serif}
header{background:#155c3b;color:white;padding:18px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px}
h1{font-size:23px}p{font-size:14px;line-height:1.6;color:#68766d}
video{width:100%;background:#17251d;border-radius:12px;max-height:420px}
button{border:0;border-radius:10px;padding:14px;font-weight:bold;cursor:pointer}
.primary{background:#155c3b;color:white;width:100%;margin-top:10px}
.secondary{background:#e8eee9;color:#155c3b;width:100%;margin-top:10px}
input{width:100%;padding:14px;border:1px solid #dce5dd;border-radius:10px;font-size:15px}
#status{white-space:pre-wrap;background:#f0f5f1;padding:12px;border-radius:9px;font-size:13px}
a{color:#155c3b;font-weight:bold}
</style>
<link rel="manifest" href="/manifest.webmanifest">\n<meta name="theme-color" content="#155c3b">\n</head>
<body>
<header>🌱 EthioFerti AI · QR Verification</header>
<main>
<section class="card">
<h1>Scan product QR code</h1>
<p>Scan an EthioFerti product QR code to read its embedded product information or verify an older registered QR token.</p>
<video id="video" autoplay muted playsinline></video>
<button class="primary" id="start">Start QR camera</button>
<button class="secondary" id="stop">Stop camera</button>
<div id="status" style="margin-top:12px">Ready. Start the camera or enter a QR value manually.</div>
</section>
<section class="card">
<h2>Enter QR data or token</h2>
<input id="manual" placeholder="Paste EF1: data or legacy QR token">
<button class="primary" id="open">Open product information</button>
</section>
<section class="card"><a href="/">← Back to dashboard</a></section>
</main>
<script src="/vendor/jsQR.js"></script>
<script>
const video=document.getElementById("video");
const statusBox=document.getElementById("status");
let stream=null,scanning=false,scanFrame=null;
function status(message){statusBox.textContent=message;}

function openToken(raw){
 let token=String(raw||"").trim();
 if(!token)return status("Enter or scan a QR code first.");
 try{
  const url=new URL(token);
  if(url.hash&&url.hash.slice(1).startsWith("EF1:"))token=url.hash.slice(1);
  else{
   const parts=url.pathname.split("/").filter(Boolean);
   if(parts.length>=2&&parts.at(-2)==="scan")token=decodeURIComponent(parts.at(-1));
  }
 }catch(error){}
 if(token.startsWith("ETHIOFERTI:"))token=token.slice(11);
 if(!token)return status("QR data is empty.");
 location.href="/scan?data="+encodeURIComponent(token);
}

document.getElementById("open").onclick=()=>openToken(document.getElementById("manual").value);

async function startCamera(){
 try{
  if(!window.jsQR)throw Error("Local QR decoder is missing.");
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,video:{facingMode:{ideal:"environment"}}
  });
  video.srcObject=stream;
  await video.play();
  scanning=true;
  status("Camera active. Hold the QR code steady inside the camera view.");
  scan();
 }catch(error){status("Camera error: "+error.message);}
}

function scan(){
 if(!scanning||video.readyState!==video.HAVE_ENOUGH_DATA){
  if(scanning)scanFrame=requestAnimationFrame(scan);
  return;
 }
 const canvas=document.createElement("canvas");
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 const context=canvas.getContext("2d",{willReadFrequently:true});
 context.drawImage(video,0,0,canvas.width,canvas.height);
 const frame=context.getImageData(0,0,canvas.width,canvas.height);
 const result=window.jsQR(frame.data,frame.width,frame.height,{inversionAttempts:"attemptBoth"});
 if(result&&result.data){
  scanning=false;
  stopCamera();
  status("QR code detected. Opening product information...");
  openToken(result.data);
  return;
 }
 scanFrame=requestAnimationFrame(scan);
}

function stopCamera(){
 scanning=false;
 if(scanFrame)cancelAnimationFrame(scanFrame);
 if(stream)stream.getTracks().forEach(track=>track.stop());
 stream=null;
 video.srcObject=null;
}
document.getElementById("start").onclick=startCamera;
document.getElementById("stop").onclick=()=>{stopCamera();status("Camera stopped.");};
window.addEventListener("pagehide",stopCamera);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(error => {
      console.error("Offline installation setup:", error);
    });
  });
}
</script>
<script src="/language.js"></script>
</body>
</html>
