plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ethioferti.ai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ethioferti.ai'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.0.2"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython = ["python3"]
        pip {
            install("fastapi==0.115.12")
            install("uvicorn==0.34.2")
            install("pydantic==1.10.27")
            install("httpx==0.28.1")
            install("python-multipart==0.0.20")
            install("qrcode==8.2")
        }
    }
}
