name: Build EthioFerti Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Package latest application files
        run: |
          mkdir -p android/app/src/main/assets/runtime/app/static
          mkdir -p android/app/src/main/assets/runtime/data/knowledge
          cp app/main.py android/app/src/main/assets/runtime/app/main.py
          cp app/__init__.py android/app/src/main/assets/runtime/app/__init__.py
          rsync -a --delete --delete-excluded --exclude='*.backup*' --exclude='*.pre-*' --exclude='*.before-*' --exclude='*.lab-backup' --exclude='__pycache__/' app/static/ android/app/src/main/assets/runtime/app/static/
          rsync -a --delete --delete-excluded --exclude='*.backup*' --exclude='*.pre-*' --exclude='*.lab-backup' --exclude='__pycache__/' data/knowledge/ android/app/src/main/assets/runtime/data/knowledge/
          if [ -f data/ethioferti.db ]; then cp data/ethioferti.db android/app/src/main/assets/runtime/data/ethioferti.db; fi

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EthioFerti-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
