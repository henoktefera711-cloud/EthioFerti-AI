name: Build EthioFerti Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Package latest app files
        run: |
          mkdir -p android/app/src/main/assets/runtime/app/static android/app/src/main/assets/runtime/data
          cp app/main.py android/app/src/main/assets/runtime/app/main.py
          touch android/app/src/main/assets/runtime/app/__init__.py
          cp -a app/static/. android/app/src/main/assets/runtime/app/static/
          if [ -f data/ethioferti.db ]; then cp data/ethioferti.db android/app/src/main/assets/runtime/data/ethioferti.db; fi
          if [ -d data/uploads ]; then mkdir -p android/app/src/main/assets/runtime/data/uploads; cp -a data/uploads/. android/app/src/main/assets/runtime/data/uploads/; fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EthioFerti-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
